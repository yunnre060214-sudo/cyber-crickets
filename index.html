<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f4ef" />
    <meta
      name="description"
      content="Cyber Crickets 2.0：可复现的算法竞技、赛事、回放与策略实验平台。"
    />
    <title>Cyber Crickets · 算法竞技平台</title>
    <link rel="stylesheet" href="./styles.css?v=2.0.0" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./">CYBER <span>CRICKETS</span><b>2.0</b></a
      ><span class="brand-description">算法竞技平台</span
      ><span id="buildVersion" class="version">2.0.0</span>
    </header>
    <nav class="workspace-nav" aria-label="工作区">
      <button data-route="arena">竞技场</button
      ><button data-route="competition">赛事中心</button
      ><button data-route="replay">回放分析</button
      ><button data-route="experiment">策略实验室</button
      ><button data-route="agents">算法图鉴</button>
    </nav>
    <main id="platform">
      <section data-workspace="arena" id="arena"></section>
      <section data-workspace="competition" id="competition" hidden></section>
      <section data-workspace="replay" id="replay" hidden></section>
      <section data-workspace="experiment" id="experiment" hidden></section>
      <section data-workspace="agents" id="agents" hidden></section>
    </main>
    <footer>
      <span>64 × 64 · 同步行动 · 公开信息 · 可复现种子</span
      ><a href="https://github.com/yunnre060214-sudo/cyber-crickets"
        >源码与规则</a
      >
    </footer>
    <script type="module" src="./app.js?v=2.0.0"></script>
  </body>
</html>
